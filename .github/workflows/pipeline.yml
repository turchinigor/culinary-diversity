name: Culinary Diversity Pipeline

on:
  schedule:
    - cron: '0 */3 * * *'  # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Classify newly-missing venues
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m src.pipeline

      - name: Enrich missing food_specialty
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m src.enrich

      - name: Regenerate spreadsheets
        run: |
          python -m src.export --which classifications
          python -m src.export --which review

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Automated pipeline run: update classifications and review data"
          git push
